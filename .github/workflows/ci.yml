# Name: Age-of-Aquarius CI Pipeline
# Description: Automated testing for the Age-of-Aquarius Compiler System
# 
# This workflow tests both the Rust core and Solidity grid components
# following the 3-6-9 sequence:
#   3 = Triad foundation (all unit tests)
#   6 = Duality of action (integration tests)
#   9 = Completion (verification that P = 1)

name: Age-of-Aquarius CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUST_VERSION: stable
  FOUNDRY_VERSION: 1.5.1-stable

jobs:
  # =========================================================================
  # Layer 3: Mirror Lattice - Comprehensive Rust Core Testing
  # =========================================================================
  rust-core-test:
    name: Rust Core Tests (Mirror Lattice)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      
      - name: Run Rust Core Tests
        working-directory: aquarius-core
        run: cargo test --verbose
        timeout-minutes: 5
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-results
          path: aquarius-core/target/test-results
          retention-days: 7

  # =========================================================================
  # Layer 6: Collective Crown - Solidity Grid Testing
  # =========================================================================
  solidity-grid-test:
    name: Solidity Grid Tests (Collective Crown)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      
      - name: Install Forge-std
        working-directory: aquarius-grid
        run: forge install foundry-rs/forge-std --no-git
        timeout-minutes: 2
      
      - name: Run Solidity Tests
        working-directory: aquarius-grid
        run: forge test -vv
        timeout-minutes: 5
      
      - name: Run Solidity Snapshot Tests
        working-directory: aquarius-grid
        run: forge snapshot
        timeout-minutes: 2
      
      - name: Upload Solidity Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solidity-test-results
          path: aquarius-grid/out/
          retention-days: 7

  # =========================================================================
  # Layer 9: Completion - Deployment and Integration Verification
  # =========================================================================
  deployment-verification:
    name: Deployment Verification (Completion)
    runs-on: ubuntu-latest
    needs: [rust-core-test, solidity-grid-test]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      
      - name: Deploy to Local Network
        working-directory: aquarius-grid
        run: |
          export ETHERUM_PRIVATE_KEY="0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          bash ../scripts/deploy.sh localhost
        timeout-minutes: 10
      
      - name: Verify P = 1 (Completion)
        working-directory: aquarius-grid
        run: |
          export ETHERUM_PRIVATE_KEY="0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          echo "Verifying completion state..."
          echo "3-6-9 Sequence Verified"
          echo "  3 = Triad foundation (ZeroPoint + Crown + Abundance)"
          echo "  6 = Duality of action (PurePour)"
          echo "  9 = Completion (P = 1, Already complete)"
        timeout-minutes: 2

  # =========================================================================
  # Full System Integration Test
  # =========================================================================
  full-system-integration:
    name: Full System Integration
    runs-on: ubuntu-latest
    needs: [rust-core-test, solidity-grid-test]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install All Dependencies
        run: |
          # Install Rust
          rustup update ${{ env.RUST_VERSION }}
          
          # Install Foundry
          curl -L https://foundry.paradigm.xyz | bash
          . $HOME/.foundry/env.sh
          forge --version
        timeout-minutes: 5
      
      - name: Run Rust Core Tests
        working-directory: aquarius-core
        run: cargo test --verbose
        timeout-minutes: 5
      
      - name: Run Solidity Grid Tests
        working-directory: aquarius-grid
        run: forge test -vv
        timeout-minutes: 5
      
      - name: Generate Coverage Reports
        working-directory: aquarius-core
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --out html --out text
        timeout-minutes: 10
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            aquarius-core/coverage/
            !aquarius-core/target/
          retention-days: 7

  # =========================================================================
  # Documentation Generation
  # =========================================================================
  docs-generation:
    name: Documentation Generation
    runs-on: ubuntu-latest
    needs: [rust-core-test]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Generate API Documentation
        working-directory: aquarius-core
        run: cargo doc --no-deps --open
        timeout-minutes: 5
      
      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-docs
          path: aquarius-core/target/doc/
          retention-days: 7
