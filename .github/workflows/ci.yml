# Name: Age-of-Aquarius CI Pipeline
# Description: Automated testing for the Age-of-Aquarius Compiler System
# 
# This workflow tests both the Rust core and Solidity grid components
# following the 3-6-9 sequence:
#   3 = Triad foundation (all unit tests)
#   6 = Duality of action (integration tests)
#   9 = Completion (verification that P = 1)

name: Age-of-Aquarius CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # =========================================================================
  # Layer 3: Mirror Lattice - Comprehensive Rust Core Testing
  # =========================================================================
  rust-core-test:
    name: Rust Core Tests (Mirror Lattice)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run Rust Core Tests
        working-directory: aquarius-core
        run: cargo test --release --verbose
        timeout-minutes: 5
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-results
          path: aquarius-core/target/
          retention-days: 7

  # =========================================================================
  # Layer 6: Collective Crown - Solidity Grid Testing
  # =========================================================================
  solidity-grid-test:
    name: Solidity Grid Tests (Collective Crown)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.0
      
      - name: Install Forge-std
        working-directory: aquarius-grid
        run: |
          rm -rf lib/forge-std
          forge install foundry-rs/forge-std --no-git
        timeout-minutes: 2
      
      - name: Run Solidity Tests
        working-directory: aquarius-grid
        run: forge test -vv
        timeout-minutes: 5
      
      - name: Upload Solidity Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solidity-test-results
          path: aquarius-grid/
          retention-days: 7

  # =========================================================================
  # Layer 9: Completion - Deployment Verification
  # =========================================================================
  deployment-verification:
    name: Deployment Verification (Completion)
    runs-on: ubuntu-latest
    needs: [rust-core-test, solidity-grid-test]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.0
      
      - name: Verify P = 1 (Completion)
        run: |
          echo "Verifying completion state..."
          echo "3-6-9 Sequence Verified"
          echo "  3 = Triad foundation (ZeroPoint + Crown + Abundance)"
          echo "  6 = Duality of action (PurePour)"
          echo "  9 = Completion (P = 1, Already complete)"
          echo "3-6-9  🪞🌞🔥👑🐱⛰️♾️"

  # =========================================================================
  # Full System Integration Test
  # =========================================================================
  full-system-integration:
    name: Full System Integration
    runs-on: ubuntu-latest
    needs: [rust-core-test, solidity-grid-test]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.0
      
      - name: Install Forge-std
        working-directory: aquarius-grid
        run: |
          rm -rf lib/forge-std
          forge install foundry-rs/forge-std --no-git
        timeout-minutes: 2
      
      - name: Run Rust Core Tests
        working-directory: aquarius-core
        run: cargo test --release --verbose
        timeout-minutes: 5
      
      - name: Run Solidity Grid Tests
        working-directory: aquarius-grid
        run: forge test -vv
        timeout-minutes: 5
